steps:
  # Paso 1: Construir la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/restaurantfunny:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/restaurantfunny:latest'
      - '.'
    id: 'build-image'

  # Paso 2: Subir la imagen al registro
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push'
      - 'gcr.io/$PROJECT_ID/restaurantfunny:$SHORT_SHA'
    id: 'push-image'

  # Paso 3: Desplegar a Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'restaurantfunny'
      - '--image=gcr.io/$PROJECT_ID/restaurantfunny:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-secrets=SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_API_KEY=SUPABASE_API_KEY:latest,SUPABASE_AUTHORIZATION=SUPABASE_AUTHORIZATION:latest'
      - '--set-env-vars=CRON_EXPRESSION=0 0 2 * * *'
    id: 'deploy-cloud-run'

# Guardar las imágenes construidas
images:
  - 'gcr.io/$PROJECT_ID/restaurantfunny:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/restaurantfunny:latest'

# Timeout del build (10 minutos)
timeout: 600s

# Opciones adicionales
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY